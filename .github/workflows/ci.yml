name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Daybreak.slnx

      - name: Build
        run: dotnet build Daybreak.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Daybreak.slnx -c Release --no-build

      - name: Publish (framework-dependent)
        run: dotnet publish Daybreak.Launcher -c Release -r win-x64 --self-contained false -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daybreak-win-x64
          path: publish
