name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要发布的 tag（如 v0.1.0）。留空则只构建产物，不发布 Release。'
        required: false
        type: string
      create_draft:
        description: '发布为草稿（可在网页补充说明后再 Publish）'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Daybreak.slnx

      - name: Build
        run: dotnet build Daybreak.slnx -c Release --no-restore

      - name: Test (offline unit tests)
        run: dotnet test Daybreak.slnx -c Release --no-build --filter "Category!=Integration"

      # 中继节点地址不在仓库里(公开仓库不该公示自建服务器)。
      # CI 从仓库 Secret 读入，package.ps1 会把它写成 easytier/relay.txt 打进包。
      #
      # 同时兼容 Secret 和 Variable 两种配置方式:很多人会顺手加成 Variable，
      # 那样 secrets.* 是空的、打包会在最后一步才失败，很难看出原因。
      - name: Check relay config
        shell: pwsh
        env:
          DAYBREAK_RELAY: ${{ secrets.DAYBREAK_RELAY || vars.DAYBREAK_RELAY }}
        run: |
          if (-not $env:DAYBREAK_RELAY) {
            Write-Host "::error::没有读到 DAYBREAK_RELAY。请到仓库 Settings → Secrets and variables → Actions 添加(Secret 或 Variable 均可)，值为中继地址 host:port"
            exit 1
          }
          # 只打印格式，不打印内容，避免把地址写进公开日志
          $v = $env:DAYBREAK_RELAY.Trim()
          if ($v -notmatch '^[^:\s]+:\d+$') {
            Write-Host "::error::DAYBREAK_RELAY 格式不对，应为 host:port"
            exit 1
          }
          Write-Host "中继地址已配置(长度 $($v.Length) 字符，格式校验通过)"

      # 安装包需要 Inno Setup。
      #
      # 重要:这一步失败**不会阻塞发版**。
      # 理由:绿色包(zip)是主产物，安装包是附加物。不能让附加物拖垮整个发布。
      # 如果这一步失败，CI 会在 Annotations 里打一条 error 注解(含真实原因)，
      # 然后继续往下跑 —— zip 照常出、Release 照常发。
      #
      # 安装策略(按顺序尝试，任一成功即继续):
      #   1. 已预装 → 直接用
      #   2. GitHub Releases 官方安装程序 → runner 访问 GitHub 是内网级
      #   3. choco 回退 → 社区源偶发超时，所以放最后
      #
      # 历史:#7/#8/#9 连续三次卡在这一步，且拿不到日志(无 token)。
      # 改成不阻塞后，发版不再被它拖住，同时用 ::error:: 暴露真实原因。
      - name: Install Inno Setup
        id: inno
        continue-on-error: true
        shell: pwsh
        run: |
          $iscc = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"

          if (Test-Path $iscc) {
            Write-Host "Inno Setup 已预装: $iscc"
            "available=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $reasons = @()

          function Test-IsccReady {
            return (Test-Path "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe") -or
                   (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          }

          # ---- 方式 1:GitHub Releases 官方安装程序 ----
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          try {
            Write-Host "尝试 1: 从 GitHub Releases 下载"
            Write-Host "  $url"
            Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing -MaximumRedirection 5 -TimeoutSec 180
            $sz = (Get-Item $installer).Length
            Write-Host "  下载完成: $([math]::Round($sz/1MB,1)) MB"
            if ($sz -lt 500KB) { throw "文件太小($sz 字节)，可能不是安装程序" }

            Write-Host "  静默安装..."
            $p = Start-Process -FilePath $installer `
              -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" `
              -Wait -PassThru
            Write-Host "  退出码: $($p.ExitCode)"
            Start-Sleep -Seconds 3

            if (Test-IsccReady) {
              Write-Host "方式 1 成功"
              "available=true" >> $env:GITHUB_OUTPUT
              exit 0
            }
            $reasons += "方式1: 安装程序退出码 $($p.ExitCode)，但未找到 ISCC.exe"
          }
          catch {
            $reasons += "方式1: $($_.Exception.Message)"
            Write-Host "  失败: $($_.Exception.Message)"
          }

          # ---- 方式 2:choco 回退 ----
          try {
            Write-Host "尝试 2: choco install innosetup"
            choco install innosetup --no-progress -y --force 2>&1 | Out-String | Write-Host
            if (Test-IsccReady) {
              Write-Host "方式 2 成功"
              "available=true" >> $env:GITHUB_OUTPUT
              exit 0
            }
            $reasons += "方式2: choco 执行完但未找到 ISCC.exe"
          }
          catch {
            $reasons += "方式2: $($_.Exception.Message)"
            Write-Host "  失败: $($_.Exception.Message)"
          }

          # ---- 都失败:用 ::error:: 注解把真实原因暴露到 GitHub UI ----
          "available=false" >> $env:GITHUB_OUTPUT
          $detail = ($reasons -join " | ") -replace "`r?`n", " "
          Write-Host "::error title=Inno Setup 安装失败::本次发版将不包含安装包。原因: $detail"
          Write-Host ""
          Write-Host "=== 现场信息 ==="
          @(
            "$env:ProgramFiles(x86)\Inno Setup 6",
            "$env:ProgramFiles\Inno Setup 6",
            "C:\ProgramData\chocolatey\bin"
          ) | ForEach-Object {
            Write-Host ("  {0} -> {1}" -f $_, (Test-Path $_))
            if (Test-Path $_) {
              Get-ChildItem $_ -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 10 |
                ForEach-Object { Write-Host "      $($_.Name)" }
            }
          }
          Write-Host ""
          Write-Host "继续发版(安装包缺失，但不阻塞 zip 和 Release)"

      - name: Package (self-contained single-file)
        shell: pwsh
        env:
          DAYBREAK_RELAY: ${{ secrets.DAYBREAK_RELAY || vars.DAYBREAK_RELAY }}
        run: ./scripts/package.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daybreak-win-x64
          # 包名必须全 ASCII:Release 上传会把非 ASCII 字符替换成 '.',使自更新器匹配失败
          # 安装包是可选产物:Inno Setup 装不上时这里不会因为它而失败
          path: |
            dist/Daybreak-beta-win-x64.zip
            dist/Daybreak-Setup-*.exe
          if-no-files-found: error
          # 缺 Setup 文件时只警告不报错
          overwrite: true

      # tag 推送 → 直接发布为正式 Release(draft=false)
      # 手动运行 → 按 create_draft 输入决定，且必须填 tag_name
      - name: Publish Release
        if: ${{ github.event_name == 'push' || github.event.inputs.tag_name != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            dist/Daybreak-beta-win-x64.zip
            dist/Daybreak-Setup-*.exe
          draft: ${{ github.event.inputs.create_draft == 'true' }}
          generate_release_notes: true
          # 必须是 false:安装包是可选产物。
          # 设 true 的话，Inno Setup 装不上时整个 Release 会失败 ——
          # 连绿色包都发不出去，这就本末倒置了。
          # (v0.1.3 之前没这个问题，因为那时只有 zip 一个文件)
          fail_on_unmatched_files: false
