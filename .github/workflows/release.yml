name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_draft:
        description: 'Create as draft release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Daybreak.slnx

      - name: Build
        run: dotnet build Daybreak.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Daybreak.slnx -c Release --no-build

      - name: Package (self-contained single-file)
        shell: pwsh
        run: |
          ./scripts/package.ps1

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: Daybreak-内测包-win-x64.zip
          draft: ${{ github.event.inputs.create_draft || true }}
          generate_release_notes: true
          fail_on_unmatched_files: true
